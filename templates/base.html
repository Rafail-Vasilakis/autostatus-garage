<!DOCTYPE html>
<html lang="el" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}AutoStatus | Workshop Pro{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        garage: {
                            900: '#0B0F19',
                            800: '#151D2F',
                            700: '#1E293B',
                            600: '#334155',
                            accent: '#F59E0B',
                            success: '#10B981',
                            danger: '#EF4444',
                            viber: '#7360F2'
                        }
                    }
                }
            }
        }
    </script>
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#151D2F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AutoStatus">
    <link rel="apple-touch-icon" href="/static/img/app-icon.png">

    <!-- Phosphor / FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-garage-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- Top Navigation Bar -->
    <header class="bg-garage-800 border-b border-garage-700 sticky top-0 z-40 shadow-lg px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 group">
                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 font-black shadow-md shrink-0">
                    <i class="fa-solid fa-wrench text-sm sm:text-base"></i>
                </div>
                <div class="truncate">
                    <div class="flex items-center gap-1.5">
                        <span class="font-extrabold text-base sm:text-lg tracking-tight text-white">
                            Auto<span class="text-amber-400">Status</span>
                        </span>
                    </div>
                    <p class="text-[10px] sm:text-[11px] text-slate-400 font-medium truncate max-w-[140px] sm:max-w-xs leading-tight">{{ aade_settings.garage_name }}</p>
                </div>
            </a>

            <!-- AADE Status Pill + Action Links -->
            <div class="flex items-center space-x-2">
                <a href="/settings/aade" class="text-[10px] px-2 py-1 rounded-lg border font-bold uppercase tracking-wider transition hover:opacity-80 flex items-center gap-1.5 {% if aade_settings.aade_env == 'production' %}bg-emerald-500/20 text-emerald-400 border-emerald-500/30{% elif aade_settings.aade_env == 'sandbox' %}bg-sky-500/20 text-sky-400 border-sky-500/30{% else %}bg-amber-500/20 text-amber-400 border-amber-500/30{% endif %}">
                    <span class="w-1.5 h-1.5 rounded-full {% if aade_settings.last_test_status == 'CONNECTED' %}bg-emerald-400 animate-pulse{% elif aade_settings.last_test_status == 'FAILED' %}bg-rose-400{% else %}bg-amber-400{% endif %}"></span>
                    <span>AADE {{ aade_settings.aade_env|upper }}</span>
                </a>

                <!-- Desktop Action Links (hidden on mobile, mobile uses bottom nav) -->
                <div class="hidden sm:flex items-center space-x-2">
                    <a href="/aade" class="px-3 py-2 text-xs font-semibold bg-garage-700 hover:bg-garage-600 rounded-lg text-slate-200 border border-garage-600 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                        <span>Πελατολόγιο ΑΑΔΕ</span>
                    </a>
                    <a href="/settings/aade" title="Ρυθμίσεις myDATA API" class="px-2.5 py-2 text-xs font-semibold bg-garage-700 hover:bg-garage-600 rounded-lg text-slate-300 border border-garage-600 flex items-center transition">
                        <i class="fa-solid fa-gear"></i>
                    </a>
                    <a href="/intake" class="px-3.5 py-2 text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg flex items-center gap-1.5 shadow-md shadow-amber-500/20 active:scale-95 transition">
                        <i class="fa-solid fa-camera"></i>
                        <span>+ Είσοδος (10'')</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main View Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-20">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Navigation Bar for Mobile -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-garage-800/95 backdrop-blur border-t border-garage-700 px-4 py-2 z-40 flex justify-around items-center">
        <a href="/" class="flex flex-col items-center text-xs font-medium text-amber-400">
            <i class="fa-solid fa-car text-base mb-0.5"></i>
            <span>Ράμπες</span>
        </a>
        <a href="/intake" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-slate-200">
            <div class="w-9 h-9 -mt-4 bg-amber-500 rounded-full flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/30 text-base">
                <i class="fa-solid fa-plus"></i>
            </div>
            <span class="text-[10px] mt-0.5">Είσοδος</span>
        </a>
        <a href="/aade" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-file-invoice text-base mb-0.5"></i>
            <span>ΑΑΔΕ</span>
        </a>
        <a href="/settings/aade" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-gear text-base mb-0.5"></i>
            <span>Ρυθμίσεις</span>
        </a>
    </nav>

    <!-- Global Toast / Modal Scripts -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
