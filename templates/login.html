<!DOCTYPE html>
<html lang="el" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Είσοδος Συνεργείου | AutoStatus Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        garage: {
                            900: '#0B0F19',
                            800: '#151D2F',
                            700: '#1E293B',
                            600: '#334155',
                            accent: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0B0F19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AutoStatus">
    <link rel="apple-touch-icon" href="/static/img/app-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-garage-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 select-none">

    <div class="w-full max-w-sm bg-garage-800/90 border border-garage-700 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur">
        
        <!-- App Header & Icon -->
        <div class="text-center space-y-2 mb-4">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 text-2xl font-black shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-wrench"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">
                    Auto<span class="text-amber-400">Status</span> Pro
                </h1>
                <p class="text-xs text-slate-400 font-medium">
                    Σύστημα Διαχείρισης & myDATA ΑΑΔΕ
                </p>
            </div>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[11px] font-bold">
                <i class="fa-solid fa-lock"></i>
                <span>Είσοδος Συνεργείου</span>
            </div>
        </div>

        <!-- Instructions -->
        <p class="text-center text-xs text-slate-300 mb-2">
            Πληκτρολογήστε το 4ψήφιο PIN του συνεργείου
        </p>

        <!-- PIN Dots Display -->
        <div id="pinDots" class="flex justify-center items-center gap-3.5 my-4">
            <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
            <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
            <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
            <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
        </div>

        <!-- Error Banner -->
        <div id="pinError" class="hidden mb-3 p-2.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-bold text-center">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> <span id="pinErrorText">Λανθασμένο PIN. Δοκιμάστε ξανά.</span>
        </div>

        <!-- Tactile Grease-Friendly Keypad -->
        <div class="grid grid-cols-3 gap-2.5 my-3">
            <button type="button" onclick="pressDigit('1')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">1</button>
            <button type="button" onclick="pressDigit('2')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">2</button>
            <button type="button" onclick="pressDigit('3')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">3</button>

            <button type="button" onclick="pressDigit('4')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">4</button>
            <button type="button" onclick="pressDigit('5')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">5</button>
            <button type="button" onclick="pressDigit('6')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">6</button>

            <button type="button" onclick="pressDigit('7')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">7</button>
            <button type="button" onclick="pressDigit('8')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">8</button>
            <button type="button" onclick="pressDigit('9')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">9</button>

            <button type="button" onclick="clearPin()" class="h-14 sm:h-16 rounded-2xl bg-garage-900/60 border border-garage-700 hover:bg-garage-700 text-xs font-bold text-slate-400 active:scale-95 transition flex items-center justify-center">
                <span>Καθαρισμός</span>
            </button>
            <button type="button" onclick="pressDigit('0')" class="h-14 sm:h-16 rounded-2xl bg-garage-700/80 border border-garage-600 hover:bg-garage-600 active:bg-amber-500/20 active:border-amber-400 text-xl font-black text-white transition active:scale-95 shadow">0</button>
            <button type="button" onclick="backspacePin()" class="h-14 sm:h-16 rounded-2xl bg-garage-900/60 border border-garage-700 hover:bg-garage-700 text-lg font-bold text-slate-300 active:scale-95 transition flex items-center justify-center">
                <i class="fa-solid fa-delete-left"></i>
            </button>
        </div>

        <!-- Helper info -->
        <div class="mt-4 pt-3 border-t border-garage-700/80 text-center space-y-1">
            <p class="text-[11px] text-slate-400">
                Προεπιλεγμένο PIN: <span class="font-mono text-amber-400 font-bold">1234</span>
            </p>
            <p class="text-[10px] text-slate-400">
                Μένει συνδεδεμένο αυτόματα στο κινητό του συνεργείου.
            </p>
        </div>

    </div>

    <!-- Hidden next url parameter -->
    <input type="hidden" id="nextUrl" value="{{ next or '/' }}">

    <script>
        let currentPin = '';
        const maxLen = 4;

        function updateDots() {
            for (let i = 0; i < maxLen; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentPin.length) {
                    dot.className = 'w-4 h-4 rounded-full bg-amber-400 border-2 border-amber-300 shadow-md shadow-amber-400/50 scale-110 transition-all duration-150';
                } else {
                    dot.className = 'w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all duration-150';
                }
            }
        }

        function pressDigit(d) {
            if (currentPin.length < maxLen) {
                currentPin += d;
                updateDots();
                hideError();

                if (currentPin.length === maxLen) {
                    submitPin();
                }
            }
        }

        function backspacePin() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
                hideError();
            }
        }

        function clearPin() {
            currentPin = '';
            updateDots();
            hideError();
        }

        function hideError() {
            const errBox = document.getElementById('pinError');
            errBox.classList.add('hidden');
        }

        function showError(msg) {
            const errBox = document.getElementById('pinError');
            document.getElementById('pinErrorText').innerText = msg;
            errBox.classList.remove('hidden');

            // Haptic vibration feedback on mobile if supported
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            // Shake animation
            const dots = document.getElementById('pinDots');
            dots.classList.add('animate-bounce');
            setTimeout(() => {
                dots.classList.remove('animate-bounce');
                clearPin();
            }, 600);
        }

        async function submitPin() {
            const next = document.getElementById('nextUrl').value;
            try {
                const res = await fetch('/api/auth/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: currentPin, next: next })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    showError(data.error || 'Λανθασμένο PIN!');
                }
            } catch (err) {
                showError('Σφάλμα σύνδεσης. Ελέγξτε το δίκτυο.');
            }
        }

        // Support physical keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressDigit(e.key);
            } else if (e.key === 'Backspace') {
                backspacePin();
            } else if (e.key === 'Escape') {
                clearPin();
            }
        });
    </script>
</body>
</html>
